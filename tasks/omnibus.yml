- name: Define omnibus image list
  ansible.builtin.set_fact:
    # TODO: Use SHA256 hashes here too instead of tags
    omnibus_images:
      - ghcr.io/waterloo-rocketry/omnibus-server:main
      - ghcr.io/waterloo-rocketry/omnibus-globallog:main
      - ghcr.io/waterloo-rocketry/omnibus-source-ljm:main
      - ghcr.io/waterloo-rocketry/omnibus-ws-server:main
      - ghcr.io/waterloo-rocketry/omnibus-ws-bridge:main
      - ghcr.io/waterloo-rocketry/omnibus-daqms:latest
    omnibus_deploy_dir: "/home/{{ ansible_user }}/omnibus-deploy"
    omnibus_images_dir: "/home/{{ ansible_user }}/omnibus-images"

- name: Create omnibus deployment directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ omnibus_deploy_dir }}"
    - "{{ omnibus_deploy_dir }}/config"
    - "{{ omnibus_deploy_dir }}/data"
    - "{{ omnibus_images_dir }}"

- name: Copy docker-compose.yml to deployment directory
  ansible.builtin.copy:
    src: services/omnibus.yml
    dest: "{{ omnibus_deploy_dir }}/docker-compose.yml"
    mode: "0644"

- name: Copy config.py.example to config directory
  ansible.builtin.copy:
    src: services/config.py
    dest: "{{ omnibus_deploy_dir }}/config/config.py.example"
    mode: "0644"

- name: Tear down existing containers (docker compose down)
  community.docker.docker_compose_v2:
    project_src: "{{ omnibus_deploy_dir }}"
    state: absent

- name: Start containers up in detached mode (docker compose up -d)
  community.docker.docker_compose_v2:
    project_src: "{{ omnibus_deploy_dir }}" 
    state: present

- name: Save omnibus Docker images to disk
  community.docker.docker_image:
    name: "{{ item }}"
    archive_path: "{{ omnibus_images_dir }}/{{ item | regex_replace('.+/', '') | regex_replace(':', '-') }}.tar"
    source: local
  loop: "{{ omnibus_images }}"

