# Disable competing network managers
- name: Stop and disable dhcpcd
  become: true
  ansible.builtin.systemd:
    name: dhcpcd
    state: stopped
    enabled: false
    masked: true
  ignore_errors: true

# Install NetworkManager and dependencies
- name: Install NetworkManager and dependencies
  become: true
  ansible.builtin.package:
    name:
      - network-manager
      - wpasupplicant
    state: present

# Enable and start NetworkManager
- name: Enable and start NetworkManager
  become: true
  ansible.builtin.systemd:
    name: NetworkManager
    state: started
    enabled: true

# Disable captive portal detection for headless operation
- name: Create NetworkManager configuration directory
  become: true
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d
    state: directory
    mode: "0755"

- name: Disable connectivity checks and captive portal detection
  become: true
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-no-connectivity-check.conf
    content: |
      [connectivity]
      enabled=false
    mode: "0644"
  register: nm_config

- name: Restart NetworkManager after configuration change
  become: true
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted
  when: nm_config.changed

# Configure wired ethernet connection (DHCP, auto-reconnect)
- name: Configure wired ethernet connection
  become: true
  community.general.nmcli:
    conn_name: "Wired Ethernet"
    ifname: eth0
    type: ethernet
    method4: auto
    autoconnect: true
    state: present

# Configure WiFi connection to UniversityOfWaterloo (open, no password)
- name: Configure WiFi connection to UniversityOfWaterloo
  become: true
  community.general.nmcli:
    conn_name: "UniversityOfWaterloo"
    type: wifi
    wifi:
      ssid: "UniversityOfWaterloo"
    method4: auto
    autoconnect: true
    state: present

# Set WiFi retry count to 10
- name: Set WiFi connection retries to 10
  become: true
  ansible.builtin.command:
    cmd: nmcli connection modify "UniversityOfWaterloo" connection.autoconnect-retries 10
  changed_when: false
