services:
  omnibus-server:
    image: ghcr.io/waterloo-rocketry/omnibus-server@sha256:306aabd78e4fadd45ec6878de40925ed21e5844b7fb0a67d065322e2433650e1
    network_mode: host
    restart: unless-stopped

  omnibus-globallog:
    image: ghcr.io/waterloo-rocketry/omnibus-globallog@sha256:2c0b344551f86ed5631d0e086559ef42a38e26e788c047f35cb58e87e261ab56
    network_mode: host
    restart: unless-stopped
    depends_on:
      - omnibus-server
    volumes:
      - ./data:/data
    command: ["--outfolder", "/data"]

  omnibus-source-ljm:
    image: ghcr.io/waterloo-rocketry/omnibus-source-ljm@sha256:56b8f1e06306b9c55cae3129503058f480f3aef43e614924e5738daccffd0558 
    network_mode: host
    restart: unless-stopped
    depends_on:
      - omnibus-server
    volumes:
      - ./config:/config
  
  omnibus-ws-bridge:
    image: ghcr.io/waterloo-rocketry/omnibus-ws-bridge@sha256:e2c98ba03d2e724ebf6d8cfb352100182c51954b00be9f97f00da193b43bd0e5 
    network_mode: host
    restart: unless-stopped
    depends_on:
      - omnibus-server
      - omnibus-ws-server

  omnibus-ws-server:
    image: ghcr.io/waterloo-rocketry/omnibus-ws-server@sha256:f846b28090aeae7bb3b69b26cb4a53bc133a9e81fa26b3f5d8abef3afc205d68
    network_mode: host
    restart: unless-stopped
    depends_on:
      - omnibus-server

  daqms:
    image: ghcr.io/waterloo-rocketry/omnibus-daqms@sha256:38e741dbac64d848e1579537990f25ea66c8728f21cc98420ac9314eba1f23d4 
    restart: unless-stopped
    depends_on:
      - omnibus-server
    ports:
      - 8080:8080

  # /dev/serial/by-path/platform-xhci-hcd.0-usb-0:1.1:1.0 is the Injector CAN support board, USB Port 1 on hub
  parsley-source-injector:
    image: ghcr.io/waterloo-rocketry/omnibus-source-parsley@sha256:9589af3a31dea4c6b4c65c31b6923b7206f31cb9be262e547f30317fb2322ccd
    restart: unless-stopped
    depends_on:
      - omnibus-server
    network_mode: host
    hostname: EGSE-INJECTOR
    devices:
      - source: /dev/serial/by-path/platform-xhci-hcd.0-usb-0:1.1:1.0
        target: /dev/ttyACM0
        permissions: rwm

  # /dev/serial/by-path/platform-xhci-hcd.0-usb-0:1.2:1.0 is the Upper CAN support board, USB Port 2 on hub
  parsley-source-upper:
    image: ghcr.io/waterloo-rocketry/omnibus-source-parsley@sha256:9589af3a31dea4c6b4c65c31b6923b7206f31cb9be262e547f30317fb2322ccd
    restart: unless-stopped
    depends_on:
      - omnibus-server
    network_mode: host
    hostname: EGSE-UPPER
    devices:
      - source: /dev/serial/by-path/platform-xhci-hcd.0-usb-0:1.2:1.0
        target: /dev/ttyACM0
        permissions: rwm
